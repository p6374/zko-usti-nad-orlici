media:
  input: media
  output: /media
  rename: safe
content:
  - name: website
    label: Texty webu ZKO
    type: file
    path: content/texty.json
    format: json
    fields:
      - name: items
        label: Upravit texty na webu
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{original}"
        fields:
          - name: id
            type: string
            hidden: true
          - name: original
            label: Původní text – neměnit
            type: string
            readonly: true
          - name: text
            label: Nový text
            type: text
  - name: photos
    label: Fotografie webu ZKO
    type: file
    path: content/fotky.json
    format: json
    fields:
      - name: uvod
        label: Úvodní fotografie
        type: image
      - name: kurzy
        label: Fotografie výcvikových kurzů
        type: image
      - name: onas
        label: Fotografie v sekci O nás
        type: image
      - name: galerie1
        label: Galerie 1
        type: image
      - name: galerie2
        label: Galerie 2
        type: image
      - name: galerie3
        label: Galerie 3
        type: image
      - name: galerie4
        label: Galerie 4
        type: image
      - name: galerie5
        label: Galerie 5
        type: image
  - name: clenove
    label: "Členové a psi"
    type: file
    path: content/clenove.json
    format: json
    fields:
      - name: clenove
        label: "Seznam členů ZKO"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{jmeno}"
        fields:
          - name: jmeno
            label: "Jméno a příjmení člena"
            type: string
          - name: fotografie
            label: "Profilová fotografie člena"
            type: image
          - name: psi
            label: "Psi tohoto člena"
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{jmeno}"
            fields:
              - name: jmeno
                label: "Jméno psa"
                type: string
              - name: plemeno
                label: "Plemeno / doplňující údaje"
                type: string
              - name: zkousky
                label: "Zkoušky (oddělte čárkami, např. BH, IGP1, IGP3)"
                type: string
              - name: vystavy
                label: "Výstavy a další úspěchy"
                type: text
              - name: fotografie
                label: "Fotografie psa"
                type: image
